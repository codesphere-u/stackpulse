name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  dependency-audit:
    name: Runtime Dependency Audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Audit runtime dependencies with pip-audit
        run: |
          uv export --no-emit-project --no-hashes --no-dev --format requirements-txt > runtime-requirements.txt
          uvx pip-audit -r runtime-requirements.txt --progress-spinner off

  docker-build:
    name: Docker Image Build & Non-Root Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build Docker image
        run: docker build -t stackpulse:ci .

      - name: Verify non-root container & package import
        run: docker run --rm stackpulse:ci python -c "import os, stackpulse; assert os.geteuid() != 0"

  test-and-lint:
    name: Lint, Typecheck & Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --extra dev --python ${{ matrix.python-version }}

      - name: Lint with Ruff
        run: uv run --python ${{ matrix.python-version }} ruff check .

      - name: Typecheck with Mypy
        run: uv run --python ${{ matrix.python-version }} mypy stackpulse

      - name: Run Pytest Suite with Coverage
        run: uv run --python ${{ matrix.python-version }} pytest -v --cov=stackpulse --cov-report=term-missing --cov-fail-under=85

      - name: Run CLI Simulation & Benchmark Smoke Check
        run: |
          uv run --python ${{ matrix.python-version }} stackpulse simulate --scenario all --count 12
          uv run --python ${{ matrix.python-version }} stackpulse benchmark --traces 200
