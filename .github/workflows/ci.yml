name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Lint with Ruff
        run: uv run --python ${{ matrix.python-version }} --with ruff ruff check .

      - name: Run Pytest Suite
        run: uv run --python ${{ matrix.python-version }} --with pytest --with fastapi --with httpx --with pydantic --with uvicorn pytest -v

      - name: Run CLI Simulation & Benchmark Smoke Check
        run: |
          uv run --python ${{ matrix.python-version }} stackpulse simulate --scenario all --count 12
          uv run --python ${{ matrix.python-version }} stackpulse benchmark --traces 200
