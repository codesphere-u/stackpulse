[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stackpulse"
version = "1.1.0"
description = "Cloud Observability, Distributed Tracing & Multi-Window SLO Reliability Platform"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [
    { name = "Akandwanaho Ivan Alvin", email = "codesphereinnovationz@gmail.com" }
]
keywords = [
    "observability",
    "opentelemetry",
    "distributed-tracing",
    "sre",
    "slo",
    "monitoring",
    "incident-response",
    "fastapi"
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "ruff>=0.3.0",
]

[project.scripts]
stackpulse = "stackpulse.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"
